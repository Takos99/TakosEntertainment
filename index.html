<script>
  // Stretches the fixed 1920x1079.47 canvas to fill the whole viewport exactly:
  // no black bars and nothing cropped. X and Y are scaled independently, so a
  // window that isn't 16:9 will distort the design slightly.
  var CANVAS_W = 1920;
  var CANVAS_H = 1079.47;
  function fitStage() {
    var wrapper = document.querySelector('.stage-wrapper');
    var stage = document.querySelector('.stage');
    var scaleX = window.innerWidth / CANVAS_W;
    var scaleY = window.innerHeight / CANVAS_H;
    stage.style.transform = 'scale(' + scaleX + ',' + scaleY + ')';
    wrapper.style.width = window.innerWidth + 'px';
    wrapper.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('DOMContentLoaded', fitStage);
</script>
